receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  memory_limiter: { check_interval: 1s, limit_mib: 400 }
  # Defence in depth: drop attributes that must never leave the platform.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.request.header.x-service-token, action: delete }
      - { key: enduser.id, action: hash }
exporters:
  debug: { verbosity: basic }
  # Production: otlphttp to your APM / SIEM (Grafana, Datadog, Elastic, Splunk, Sentinel).
service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, attributes/scrub, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
    logs: { receivers: [otlp], processors: [memory_limiter, attributes/scrub, batch], exporters: [debug] }
