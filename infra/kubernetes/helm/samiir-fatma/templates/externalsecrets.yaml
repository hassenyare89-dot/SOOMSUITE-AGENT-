{{- /* Secrets are synced from the secret manager by External Secrets Operator. Each service
receives ONLY its own keys; database credentials are per-role (prefer IAM auth / Vault
dynamic credentials where supported). */}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: {{ $name }}-secrets }
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $.Values.global.secretStore }} }
  target:
    name: {{ $name }}-secrets
    template:
      data:
        REDIS_URL: "{{ "{{" }} .redisUrl {{ "}}" }}"
        {{- if $svc.dbRole }}
        DATABASE_URL: "postgresql+asyncpg://{{ $svc.dbRole }}:{{ "{{" }} .dbPassword {{ "}}" }}@{{ $.Values.global.databaseHost }}/{{ $.Values.global.databaseName }}?ssl=verify-full"
        {{- end }}
        {{- range $svc.secrets }}
        {{ include "sf.envName" . }}: '{{ "{{" }} index . "{{ . }}" {{ "}}" }}'
        {{- end }}
  data:
    - { secretKey: redisUrl, remoteRef: { key: platform/redis/{{ $name }}, property: url } }
    {{- if $svc.dbRole }}
    - { secretKey: dbPassword, remoteRef: { key: platform/db/{{ $svc.dbRole }}, property: password } }
    {{- end }}
    {{- range $svc.secrets }}
    - { secretKey: {{ . }}, remoteRef: { key: platform/secrets/{{ . }}, property: value } }
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: {{ $name }}-identity }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $.Values.global.secretStore }} }
  target: { name: {{ $name }}-identity }
  data:
    - { secretKey: key.pem, remoteRef: { key: platform/identity/{{ $name }}, property: private_key } }
{{- end }}
