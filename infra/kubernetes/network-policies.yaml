apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: scanner-from-temporal-only, namespace: platform}
spec:
 podSelector: {matchLabels: {app: scanner-worker}}
 policyTypes: [Ingress]
 ingress:
 - from:
   - podSelector: {matchLabels: {app: temporal-worker}}
   ports: [{protocol: TCP, port: 7233}]
