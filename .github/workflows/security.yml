name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  sast:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with: { languages: "python, javascript-typescript", queries: security-extended }
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: Bandit
        run: pip install bandit && bandit -q -r packages services -x '*/tests/*' -ll
      - name: Semgrep
        run: pip install semgrep && semgrep scan --config p/owasp-top-ten --config p/python --error --metrics=off

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - name: pip-audit
        run: pip install pip-audit && pip-audit --strict -r <(python scripts/print_requirements.py pyproject.toml agents,temporal,email,dns,scanner)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: npm audit
        working-directory: apps/web
        run: npm ci --no-audit && npm audit --audit-level=high --omit=dev

  images:
    runs-on: ubuntu-24.04
    needs: [secrets-scan, sast, dependencies]
    permissions:
      contents: read
      packages: write
      id-token: write            # keyless cosign signing + SLSA provenance
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway, dir: api-gateway, app: "api_gateway.main:create_public" }
          - { name: samiir-agent, dir: samiir-agent, app: "samiir_agent.main:create", extras: agents }
          - { name: crm, dir: crm, app: "crm_service.main:create" }
          - { name: scheduling, dir: scheduling, app: "scheduling_service.main:create" }
          - { name: knowledge, dir: knowledge, app: "knowledge_service.main:create" }
          - { name: notifications, dir: notifications, app: "notifications_service.main:create", extras: email }
          - { name: whatsapp, dir: whatsapp, app: "whatsapp_service.main:create" }
          - { name: fatma-soc, dir: fatma-soc, app: "fatma_soc.main:create", extras: agents }
          - { name: security-ingest, dir: security-ingest, app: "security_ingest.main:create", extras: temporal }
          - { name: scanner-controller, dir: scanner-controller, app: "scanner_controller.main:create", extras: "temporal,dns" }
          - { name: approvals, dir: approvals, app: "approval_service.main:create" }
          - { name: audit, dir: audit, app: "audit_service.main:create" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/python.Dockerfile
          build-args: |
            SERVICE_DIR=${{ matrix.dir }}
            APP=${{ matrix.app }}
            EXTRAS=${{ matrix.extras }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}:${{ github.sha }}
          # Attestations need a registry push: the local docker exporter used on PRs (load)
          # cannot store the resulting manifest list. SBOM for PRs comes from the step below.
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      - name: Sign image (keyless)
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Build provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  iac:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Trivy config scan (Dockerfiles, Terraform, Helm, compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: ., severity: "CRITICAL,HIGH", exit-code: "1" }
