name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  sast:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v3
        with: { languages: "python, javascript-typescript", queries: security-extended }
      - uses: github/codeql-action/analyze@v3
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Bandit
        run: pip install bandit && bandit -q -r packages services -x '*/tests/*' -ll
      - name: Semgrep
        run: pip install semgrep && semgrep scan --config p/owasp-top-ten --config p/python --error --metrics=off

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: pip-audit
        run: pip install pip-audit && pip-audit --strict -r <(python scripts/print_requirements.py pyproject.toml agents,temporal,email,dns,scanner)
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: npm audit
        working-directory: apps/web
        run: npm ci --no-audit && npm audit --audit-level=high --omit=dev

  images:
    runs-on: ubuntu-24.04
    needs: [secrets-scan, sast, dependencies]
    permissions:
      contents: read
      packages: write
      id-token: write            # keyless cosign signing + SLSA provenance
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway, dir: api-gateway, app: "api_gateway.main:create_public" }
          - { name: samiir-agent, dir: samiir-agent, app: "samiir_agent.main:create", extras: agents }
          - { name: crm, dir: crm, app: "crm_service.main:create" }
          - { name: scheduling, dir: scheduling, app: "scheduling_service.main:create" }
          - { name: knowledge, dir: knowledge, app: "knowledge_service.main:create" }
          - { name: notifications, dir: notifications, app: "notifications_service.main:create", extras: email }
          - { name: whatsapp, dir: whatsapp, app: "whatsapp_service.main:create" }
          - { name: fatma-soc, dir: fatma-soc, app: "fatma_soc.main:create", extras: agents }
          - { name: security-ingest, dir: security-ingest, app: "security_ingest.main:create", extras: temporal }
          - { name: scanner-controller, dir: scanner-controller, app: "scanner_controller.main:create", extras: "temporal,dns" }
          - { name: approvals, dir: approvals, app: "approval_service.main:create" }
          - { name: audit, dir: audit, app: "audit_service.main:create" }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          build-args: |
            SERVICE_DIR=${{ matrix.dir }}
            APP=${{ matrix.app }}
            EXTRAS=${{ matrix.extras }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Sign image (keyless)
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}@${{ steps.build.outputs.digest }}
      - name: Build provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/samiir-fatma/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  iac:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Trivy config scan (Dockerfiles, Terraform, Helm, compose)
        uses: aquasecurity/trivy-action@0.33.1
        with: { scan-type: config, scan-ref: ., severity: "CRITICAL,HIGH", exit-code: "1" }
