name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci-superuser@localhost:5432/platform_test
      TEST_DATABASE_URL: postgresql+asyncpg://platform_owner:ci-owner@localhost:5432/platform_test
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy packages/platform-core/src services/*/src --ignore-missing-imports || true
      - name: Prepare database
        run: |
          PGPASSWORD=ci-superuser psql -h localhost -U postgres -c "CREATE ROLE platform_owner LOGIN CREATEROLE PASSWORD 'ci-owner'"
          PGPASSWORD=ci-superuser psql -h localhost -U postgres -c "CREATE DATABASE platform_test OWNER platform_owner"
      - name: Unit, integration and security tests
        run: pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pytest-results, path: pytest.xml }

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: azure/setup-helm@v4
      - run: helm lint infra/kubernetes/helm/samiir-fatma
      - run: helm template t infra/kubernetes/helm/samiir-fatma > /tmp/rendered.yaml
      - name: Policy check (kube-linter)
        uses: stackrox/kube-linter-action@v1
        with: { directory: /tmp/rendered.yaml }

  terraform:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: infra/terraform/aws } }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false && terraform validate
