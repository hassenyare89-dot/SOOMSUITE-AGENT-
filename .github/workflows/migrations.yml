name: database-migrations

on:
  pull_request:
    paths: ["packages/database/**", "packages/platform-core/src/platform_core/db/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - name: Upgrade → downgrade → upgrade (reversibility) and drift check
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://platform_owner:owner@localhost:5432/platform
        run: |
          export PGPASSWORD=ci
          psql -h localhost -U postgres -c "CREATE ROLE platform_owner LOGIN CREATEROLE PASSWORD 'owner'"
          psql -h localhost -U postgres -c "CREATE DATABASE platform OWNER platform_owner"
          for e in vector pgcrypto btree_gist pg_trgm; do psql -h localhost -U postgres -d platform -c "CREATE EXTENSION $e"; done
          alembic -c packages/database/alembic.ini upgrade head
          alembic -c packages/database/alembic.ini downgrade base
          alembic -c packages/database/alembic.ini upgrade head
          alembic -c packages/database/alembic.ini upgrade head --sql > /dev/null
      - name: Schema drift test
        env:
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/platform_drift
          TEST_DATABASE_URL: postgresql+asyncpg://platform_owner:owner@localhost:5432/platform_drift
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -c "CREATE DATABASE platform_drift OWNER platform_owner"
          pytest -q tests/integration/test_schema_drift.py

  deploy:
    # Migrations are never run ad hoc: they ship with the release that needs them.
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    # Protected environment: required reviewers + deployment branch policy (main only).
    environment: ${{ inputs.environment }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Assume deploy role (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.MIGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Helm upgrade (migrations run first as a pre-upgrade hook Job)
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}"
          helm upgrade --install platform infra/kubernetes/helm/samiir-fatma -n platform \
            --set global.imageRegistry="ghcr.io/${{ github.repository_owner }}/samiir-fatma" \
            --set global.imageTag="${GITHUB_SHA}" \
            --set global.environment="${{ inputs.environment }}" \
            --set global.domain="${{ vars.PLATFORM_DOMAIN }}" \
            --atomic --wait --timeout 20m
