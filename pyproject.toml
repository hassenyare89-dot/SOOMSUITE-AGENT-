[project]
name = "samiir-fatma-platform"
version = "0.2.0"
description = "Secure multi-tenant SAMIIR customer-service and FATMA defensive SOC platform"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "asyncpg>=0.31,<1",
  "alembic>=1.20,<2",
  "pgvector>=0.5,<1",
  "redis>=8.1,<9",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.15,<3",
  "cryptography>=50,<51",
  "python-multipart>=0.0.20",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
]

[project.optional-dependencies]
# Only the agent services install the model SDK; no other image contains it.
agents = ["openai-agents>=0.22,<0.23", "openai>=3.19,<4"]
temporal = ["temporalio>=1.33,<2"]
email = ["aiosmtplib>=5.1,<6"]
dns = ["dnspython>=2.8,<3"]
scanner = ["temporalio>=1.33,<2", "yara-python>=4.5,<5", "pyyaml>=6,<7"]
dev = [
  "openai-agents>=0.22,<0.23", "openai>=3.19,<4", "temporalio>=1.33,<2", "aiosmtplib>=5.1,<6",
  "dnspython>=2.8,<3", "yara-python>=4.5,<5", "pyyaml>=6,<7",
  "pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "respx>=0.23,<1",
  "ruff>=0.16,<1", "mypy>=1.18,<2", "pip-audit>=2.9,<3", "bandit>=1.8,<2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "packages/platform-core/src",
  "services/api-gateway/src",
  "services/samiir-agent/src",
  "services/fatma-soc/src",
  "services/crm/src",
  "services/scheduling/src",
  "services/notifications/src",
  "services/knowledge/src",
  "services/whatsapp/src",
  "services/security-ingest/src",
  "services/scanner-controller/src",
  "services/scanner-worker/src",
  "services/approvals/src",
  "services/audit/src",
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yar", "*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "db: requires a PostgreSQL database with pgvector (TEST_DATABASE_URL)",
  "redis: requires Redis (TEST_REDIS_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:temporalio.*"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["apps/web", "packages/database/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S311", "UP046", "S105", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "E501"]
"scripts/**/*.py" = ["S603", "S607"]
"services/scanner-worker/**/*.py" = ["S603", "ASYNC240", "S108"]

[tool.ruff.lint.isort]
known-first-party = [
  "platform_core", "api_gateway", "samiir_agent", "fatma_soc", "crm_service",
  "scheduling_service", "notifications_service", "knowledge_service", "whatsapp_service",
  "security_ingest", "scanner_controller", "scanner_worker", "approval_service", "audit_service",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
