name: samiir-fatma
services:
  gateway:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [public, samiir, control]
    read_only: true
    tmpfs: [/tmp]
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_DB: platform, POSTGRES_USER: platform, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform"], interval: 5s, timeout: 3s, retries: 10}
    networks: [samiir, fatma, control]
  redis:
    image: redis:8-alpine
    command: ["redis-server","--requirepass","${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10}
    networks: [samiir, fatma, control]
  temporal:
    image: temporalio/auto-setup:1.28
    environment: {DB: postgresql, DB_PORT: 5432, POSTGRES_USER: platform, POSTGRES_PWD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_SEEDS: postgres}
    depends_on: [postgres]
    networks: [control]
  scanner-worker:
    build: .
    command: ["python","-m","app.workers.scanner"]
    profiles: [scanner]
    networks: [fatma, control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
 public: {}
 samiir: {internal: true}
 fatma: {internal: true}
 control: {internal: true}
volumes: {postgres-data: {}}
